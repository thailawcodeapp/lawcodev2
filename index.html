<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ece4d4" />
    <title>ประมวลกฎหมาย · ราชอาณาจักรไทย</title>
    <!-- Wave must have its colours from the first frame, before React loads.
         Same rules as lib/theme.js: no saved theme means Wave, and Wave's
         "auto" mode follows the device. It runs before the app reads settings,
         so it is also where everyone is moved to Wave dark, once; what they
         choose after that stays. -->
    <script>
      (function () {
        var s = {};
        try { s = JSON.parse(localStorage.getItem('lawcode-eng-settings') || '{}') || {}; } catch (e) {}
        try {
          if (!localStorage.getItem('lawcode-wave-dark-rollout')) {
            s.theme = 'wave';
            s.waveMode = 'dark';
            localStorage.setItem('lawcode-eng-settings', JSON.stringify(s));
            localStorage.setItem('lawcode-wave-dark-rollout', '1');
          }
        } catch (e) {}
        if (s.theme === 'classic') return;
        var mode = s.waveMode === 'light' || s.waveMode === 'dark' ? s.waveMode : 'auto';
        var sys = false;
        try { sys = window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) {}
        document.documentElement.classList.add('theme-wave');
        if (mode === 'dark' || (mode === 'auto' && sys)) document.documentElement.classList.add('dark');
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Trirong:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,200;1,300;1,400;1,500;1,600;1,700&family=Sarabun:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
