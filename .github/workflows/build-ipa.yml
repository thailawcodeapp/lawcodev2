name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          # macos-latest ships several Xcode versions side by side; the default
          # `xcodebuild` symlink can point at an older one whose SDK App Store
          # Connect rejects ("must be built with iOS 26 SDK or later"). Pick the
          # newest installed Xcode explicitly instead of trusting the default.
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Available Xcode installs:"
          ls -d /Applications/Xcode*.app
          echo "Selecting: $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Write GoogleService-Info.plist
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_PLIST_BASE64 }}" | base64 --decode \
            > ios/App/App/GoogleService-Info.plist

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor to iOS
        run: npx cap sync ios

      - name: Add Google Sign-In URL scheme to Info.plist
        run: |
          # Google Sign-In (GoogleSignIn SDK, used by @capacitor-firebase for the
          # google.com provider) crashes the moment the sign-in flow starts unless
          # the app registers the reversed client id as a URL scheme. That value
          # lives in GoogleService-Info.plist (CI-injected, gitignored), so inject
          # it into Info.plist here instead of committing it to the repo.
          PLIST="ios/App/App/Info.plist"
          GSI="ios/App/App/GoogleService-Info.plist"
          REVERSED=$(/usr/libexec/PlistBuddy -c "Print :REVERSED_CLIENT_ID" "$GSI")
          echo "Reversed client id: $REVERSED"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string $REVERSED" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes" "$PLIST"

      - name: Fix SPM identity conflict
        run: |
          # @capacitor/app and @capacitor-firebase/app both resolve to SPM identity
          # 'app' in Swift 5.9+ (the name: param is ignored for identity).
          # Create a symlink with a unique directory name so SPM sees two identities.
          ln -sf "$(pwd)/node_modules/@capacitor-firebase/app" \
                 node_modules/@capacitor-firebase/firebase-app
          sed -i '' \
            's|node_modules/@capacitor-firebase/app|node_modules/@capacitor-firebase/firebase-app|g' \
            ios/App/CapApp-SPM/Package.swift

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: ios/App/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('ios/App/CapApp-SPM/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve SPM packages
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -resolvePackageDependencies \
            -clonedSourcePackagesDirPath ios/App/SourcePackages

      - name: Import Distribution Certificate
        env:
          CERT_B64: ${{ secrets.IOS_DISTRIBUTION_CERT_BASE64 }}
          CERT_PASS: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
        run: |
          echo "$CERT_B64" | base64 --decode > certificate.p12
          security create-keychain -p "ci_keychain_pass" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "ci_keychain_pass" build.keychain
          security import certificate.p12 -k build.keychain -P "$CERT_PASS" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "ci_keychain_pass" build.keychain
          rm certificate.p12
          # Detect the EXACT signing identity name (could be "Apple Distribution"
          # or "iPhone Distribution" depending on when the cert was issued).
          # Hardcoding the wrong one fails the archive — read it from the keychain.
          SIGN_ID=$(security find-identity -v -p codesigning build.keychain \
            | grep -oE '"[^"]+"' | head -1 | tr -d '"')
          echo "Detected signing identity: $SIGN_ID"
          echo "SIGNING_IDENTITY=$SIGN_ID" >> "$GITHUB_ENV"

      - name: Install Provisioning Profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/jurisvoice.mobileprovision

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath ${{ github.workspace }}/App.xcarchive \
            -clonedSourcePackagesDirPath ios/App/SourcePackages \
            DEVELOPMENT_TEAM=B446DTJ8Y8 \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            -quiet

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath ${{ github.workspace }}/App.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath ${{ github.workspace }}/build

      - name: Upload to TestFlight
        continue-on-error: true
        env:
          API_KEY_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          if [ -z "$API_KEY_B64" ]; then
            echo "API key not configured — skipping TestFlight upload."
            echo "Download IPA from the artifact below and upload via App Store Connect web."
            exit 0
          fi
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$API_KEY_B64" | base64 --decode \
            > ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8
          set +e
          xcrun altool --upload-app \
            --type ios \
            --file "${{ github.workspace }}/build/App.ipa" \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$ISSUER_ID" 2>&1 | tee /tmp/altool.log
          set -e

          # This step is continue-on-error so a missing API key still leaves a
          # downloadable IPA behind. The cost was that a REAL rejection looked
          # identical to success: the job went green and nothing reached
          # TestFlight. That happened with a duplicate build number — the iOS
          # build number lives in the Xcode project, not in src/config.js or
          # build.gradle, so bumping those two left CFBundleVersion unchanged
          # and App Store Connect refused a version it already had.
          if grep -q "UPLOAD SUCCEEDED" /tmp/altool.log; then
            echo "::notice title=TestFlight::Upload succeeded."
          else
            echo "::error title=TestFlight::UPLOAD FAILED — nothing reached TestFlight. See the altool output above."
            grep -i "error\|Invalid\|already exists\|train" /tmp/altool.log | head -20 || true
            echo "Most common cause: CURRENT_PROJECT_VERSION in ios/App/App.xcodeproj was not raised, so this build number already exists."
            exit 1
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: juris-voice-ios-${{ github.run_number }}
          path: ${{ github.workspace }}/build/App.ipa
          retention-days: 7
